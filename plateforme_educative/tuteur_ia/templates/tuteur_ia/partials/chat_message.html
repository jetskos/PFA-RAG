<div class="mb-3">
    <div class="bg-light p-3 rounded d-inline-block" style="max-width: 80%;">
        <strong>{{ sender|capfirst }}:</strong><br/>
        {{ message }}
    </div>
</div>

{% if mastery_score is not None %}
<script>
    const percent = Math.round({{ mastery_score }} * 100);
    document.getElementById('mastery-score').textContent = percent + '%';
    document.getElementById('mastery-bar').style.width = percent + '%';
</script>
{% endif %}

{% if session_status %}
<script>
    const statusBadge = '{{ session_status }}' === 'TERMINEE' ? 
        '<span class="badge bg-success">Terminée</span>' :
        '<span class="badge bg-info">En cours</span>';
    document.getElementById('session-status').innerHTML = statusBadge;
    
    if ('{{ session_status }}' === 'TERMINEE') {
        document.getElementById('message-input').disabled = true;
        document.getElementById('submit-btn').disabled = true;
    }
</script>
{% endif %}
