<style>
    .logistics-nav-tabs {
        display: inline-flex;
        background: var(--gray-100, rgba(0, 0, 0, 0.03));
        border: 1px solid var(--border-light, #e2e8f0);
        padding: 0.3rem;
        border-radius: 12px;
        gap: 0.2rem;
        margin-bottom: 2rem;
        position: relative;
        z-index: 5;
    }
    
    .logistics-nav-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 0.55rem 1.2rem;
        font-size: 0.88rem;
        font-weight: 600;
        color: var(--text-secondary);
        text-decoration: none;
        border-radius: 9px;
        transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    .logistics-nav-link:hover {
        color: var(--text-primary);
        background: rgba(0, 0, 0, 0.02);
    }
    
    .logistics-nav-link.active {
        color: var(--primary, #0d9488);
        background: var(--bg-surface, #ffffff);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.04), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
    }

    [data-theme="dark"] .logistics-nav-tabs {
        background: rgba(255, 255, 255, 0.03);
        border-color: var(--border-light);
    }
    [data-theme="dark"] .logistics-nav-link.active {
        background: var(--bg-elevated, #334155);
        color: #ffffff;
    }
</style>

<div class="logistics-nav-tabs">
    <a href="{% url 'logistics:inventaire' %}" class="logistics-nav-link {% if active_page == 'inventaire' %}active{% endif %}">
        <i class="ti ti-package" style="font-size: 1.05rem;"></i> Inventaire
    </a>
    <a href="{% url 'logistics:tickets' %}" class="logistics-nav-link {% if active_page == 'tickets' %}active{% endif %}">
        <i class="ti ti-ticket" style="font-size: 1.05rem;"></i> Support & Tickets
    </a>
</div>
