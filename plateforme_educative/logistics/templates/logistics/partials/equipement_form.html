<style>
    .logistics-form-group {
        margin-bottom: 1.25rem;
    }
    .logistics-form-group label {
        display: block;
        font-size: 0.88rem;
        font-weight: 600;
        color: var(--text-secondary);
        margin-bottom: 0.35rem;
    }
    .logistics-form-group input[type="text"],
    .logistics-form-group select,
    .logistics-form-group textarea {
        width: 100%;
        padding: 0.65rem 0.9rem;
        border: 1px solid var(--border-default, #cbd5e1);
        border-radius: 8px;
        background: var(--bg-surface, #ffffff);
        color: var(--text-primary);
        font-size: 0.9rem;
        transition: border-color 0.2s, box-shadow 0.2s;
    }
    .logistics-form-group input[type="text"]:focus,
    .logistics-form-group select:focus,
    .logistics-form-group textarea:focus {
        outline: none;
        border-color: var(--primary, #0d9488);
        box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.1);
    }
    .logistics-form-group .error-text {
        color: #ef4444;
        font-size: 0.8rem;
        margin-top: 0.25rem;
        display: block;
    }
</style>

<form id="equipement-form" method="post" action="{{ action_url }}"
      hx-post="{{ action_url }}"
      hx-target="#equipements-list"
      hx-swap="innerHTML"
      hx-on::after-request="if(event.detail.target.id === 'equipements-list') document.getElementById('form-equipement-container').innerHTML = document.getElementById('placeholder-template').innerHTML"
      style="margin: 0; display: block; width: 100%;">
    {% csrf_token %}

    <div style="background: transparent; border: none; padding: 0; margin-top: 1rem;">
        {% if form.non_field_errors %}
            <div class="messages" style="margin-bottom: 1rem;">
                {% for error in form.non_field_errors %}
                    <p class="message-item">{{ error }}</p>
                {% endfor %}
            </div>
        {% endif %}

        {% for field in form %}
            <div class="logistics-form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <span class="error-text">{{ field.errors.0 }}</span>
                {% endif %}
            </div>
        {% endfor %}

        <div style="display: flex; gap: 0.5rem; align-items: center; margin-top: 1.5rem;">
            <button type="submit" class="logistics-btn-primary" style="padding: 0.55rem 1.3rem;">
                {{ submit_label|default:'Soumettre' }}
            </button>
            <button type="button" class="btn btn-ghost" 
                    hx-on:click="document.getElementById('form-equipement-container').innerHTML = document.getElementById('placeholder-template').innerHTML"
                    style="border-radius: 10px; font-size: 0.85rem; font-weight: 600; padding: 0.55rem 1.2rem;">
                Annuler
            </button>
        </div>
    </div>
</form>
