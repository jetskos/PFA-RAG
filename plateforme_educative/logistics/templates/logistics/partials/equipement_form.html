<div class="modal-backdrop-premium" id="equipement-modal-backdrop" onclick="document.getElementById('form-equipement-container').innerHTML=''" style="position: fixed; inset: 0; background: rgba(20, 17, 13,0.5); backdrop-filter: blur(6px); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 1.5rem;">
    <div class="modal-card-premium" onclick="event.stopPropagation()" style="background: var(--surface); width: 100%; max-width: 600px; border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.15); overflow: hidden; animation: modalSlideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); display: flex; flex-direction: column; max-height: 90vh;">
        
        <div style="padding: 1.25rem 1.75rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;">
            <h2 style="margin: 0; font-size: 1.1rem; font-weight: 800; color: var(--ink); display: flex; align-items: center; gap: 0.5rem;">
                <div style="width: 32px; height: 32px; border-radius: 8px; background: rgba(15,118,110,0.1); color: var(--teal); display: flex; align-items: center; justify-content: center;">
                    <i class="ti ti-edit"></i>
                </div>
                Formulaire équipement
            </h2>
            <button type="button" onclick="document.getElementById('form-equipement-container').innerHTML=''" style="background: transparent; border: none; font-size: 1.25rem; color: var(--ink-muted); cursor: pointer; padding: 0.2rem; transition: color 0.15s;" onmouseover="this.style.color='var(--ink)'" onmouseout="this.style.color='var(--ink-muted)'">
                <i class="ti ti-x"></i>
            </button>
        </div>

        <form id="equipement-form" method="post" action="{{ action_url }}"
              hx-post="{{ action_url }}"
              hx-target="#equipements-list"
              hx-swap="innerHTML"
              hx-on::after-request="if(event.detail.target.id === 'equipements-list') document.getElementById('form-equipement-container').innerHTML = ''"
              style="display: flex; flex-direction: column; min-height: 0;">
            {% csrf_token %}

            <div style="padding: 1.75rem; overflow-y: auto; flex-grow: 1; display: flex; flex-direction: column; gap: 1.25rem;">
                {% if form.non_field_errors %}
                    <div style="padding: 1rem; border-radius: 8px; background: rgba(239,68,68,0.1); color: var(--red); border: 1px solid rgba(239,68,68,0.2);">
                        {% for error in form.non_field_errors %}
                            <p style="margin: 0; font-size: 0.85rem; font-weight: 600;">{{ error }}</p>
                        {% endfor %}
                    </div>
                {% endif %}

                {% for field in form %}
                    <div style="display: flex; flex-direction: column; gap: 0.4rem;">
                        <label for="{{ field.id_for_label }}" style="font-size: 0.85rem; font-weight: 700; color: var(--ink-mid);">
                            {{ field.label }}
                        </label>
                        {{ field }}
                        {% if field.errors %}
                            <span style="font-size: 0.75rem; color: var(--red); font-weight: 600;"><i class="ti ti-alert-circle"></i> {{ field.errors.0 }}</span>
                        {% endif %}
                    </div>
                {% endfor %}
            </div>

            <div style="padding: 1.25rem 1.75rem; border-top: 1px solid var(--border); background: var(--bg); display: flex; justify-content: flex-end; gap: 0.75rem; flex-shrink: 0;">
                <button type="button" style="display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.65rem 1.1rem; background: transparent; color: var(--ink-muted); border: 1.5px solid var(--border); border-radius: 8px; font-size: 0.875rem; font-weight: 700; cursor: pointer; transition: all 0.15s;" onclick="document.getElementById('form-equipement-container').innerHTML=''" onmouseover="this.style.borderColor='var(--ink-mid)'; this.style.color='var(--ink)'" onmouseout="this.style.borderColor='var(--border)'; this.style.color='var(--ink-muted)'">
                    Annuler
                </button>
                <button type="submit" style="display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.65rem 1.4rem; background: var(--brand-primary); color: #fff; border: none; border-radius: 8px; font-size: 0.875rem; font-weight: 700; cursor: pointer; transition: background 0.15s;" onmouseover="this.style.background='var(--ink)'" onmouseout="this.style.background='var(--brand-primary)'">
                    {{ submit_label|default:'Enregistrer' }} <i class="ti ti-check"></i>
                </button>
            </div>
        </form>
    </div>
</div>

<style>
    @keyframes modalSlideIn {
        from { opacity: 0; transform: translateY(20px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }
    #equipement-form input, #equipement-form select, #equipement-form textarea {
        width: 100%;
        padding: 0.65rem 1rem;
        border-radius: 8px;
        border: 1.5px solid var(--border);
        font-family: inherit;
        font-size: 0.9rem;
        color: var(--ink);
        background: var(--surface);
        transition: all 0.15s;
    }
    #equipement-form input:focus, #equipement-form select:focus, #equipement-form textarea:focus {
        outline: none;
        border-color: var(--brand-primary);
        box-shadow: 0 0 0 3px rgba(166, 80, 31, 0.3);
    }
    #equipement-form input[type="checkbox"] {
        width: auto;
    }
</style>
