<form id="equipement-form" method="post" action="{{ action_url }}"
      hx-post="{{ action_url }}"
      hx-target="#equipements-list"
      hx-swap="innerHTML"
      hx-on::after-request="if(event.detail.target.id === 'equipements-list') document.getElementById('form-equipement-container').innerHTML = document.getElementById('placeholder-template').innerHTML">
    {% csrf_token %}

    <div class="carte mt-3">
        {% if form.non_field_errors %}
            <div class="messages">
                {% for error in form.non_field_errors %}
                    <p class="message-item">{{ error }}</p>
                {% endfor %}
            </div>
        {% endif %}

        {% for field in form %}
            <p>
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <span class="error-text">{{ field.errors.0 }}</span>
                {% endif %}
            </p>
        {% endfor %}

        <div class="actions">
            <button type="submit" class="btn">{{ submit_label|default:'Soumettre' }}</button>
            <button type="button" class="btn btn-ghost" hx-on:click="document.getElementById('form-equipement-container').innerHTML = document.getElementById('placeholder-template').innerHTML">Annuler</button>
        </div>
    </div>
</form>
