<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Erreur serveur — EduTech</title>
    <style>
        body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
               background: #f8fafc; color: #0f172a; display: flex; min-height: 100vh;
               align-items: center; justify-content: center; }
        .box { max-width: 30rem; padding: 2.5rem 1.5rem; text-align: center; }
        .code { font-size: 4rem; font-weight: 800; color: #0d9488; line-height: 1; }
        h1 { font-size: 1.35rem; margin: 1rem 0 .5rem; }
        p { color: #64748b; margin-bottom: 1.75rem; }
        a { display: inline-block; background: #0d9488; color: #fff; text-decoration: none;
            font-weight: 700; padding: .7rem 1.2rem; border-radius: 10px; }
        @media (prefers-color-scheme: dark) {
            body { background: #0f172a; color: #e2e8f0; }
            p { color: #94a3b8; }
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="code">500</div>
        <h1>Une erreur est survenue</h1>
        <p>Le serveur a rencontré un problème inattendu. Réessayez dans un instant.
           A server error occurred. Please try again shortly.</p>
        <a href="/">Accueil / Home</a>
    </div>
</body>
</html>
