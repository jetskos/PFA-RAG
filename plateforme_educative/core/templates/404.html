{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Page introuvable" %}{% endblock %}

{% block content %}
<div style="max-width: 32rem; margin: 4rem auto; padding: 2rem 1.5rem; text-align: center;">
    <div style="font-size: 4rem; font-weight: 800; color: var(--primary, #0d9488); line-height: 1;">404</div>
    <h1 style="font-size: 1.4rem; margin: 1rem 0 0.5rem;">{% trans "Cette page n'existe pas" %}</h1>
    <p style="color: var(--text-secondary, #64748b); margin-bottom: 1.75rem;">
        {% trans "Le lien est peut-être cassé, ou la page a été déplacée." %}
    </p>
    <a href="/" class="btn btn-primary" style="text-decoration: none;">
        {% trans "Retour à l'accueil" %}
    </a>
</div>
{% endblock %}
