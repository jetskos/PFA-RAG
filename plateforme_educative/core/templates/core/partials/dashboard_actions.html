<div class="dash-actions">
    {% if role == 'FORMATEUR' %}
        <div class="dash-card">
            <div>
                <div class="title">Mes cours</div>
                <div class="muted">Accédez à vos cours et éditez leur contenu.</div>
            </div>
            <div class="cta">
                <a href="{% url 'apprentissage:espace_formateur' %}" class="btn">Voir mes cours</a>
            </div>
        </div>
        <div class="dash-card">
            <div>
                <div class="title">Nouvelle demande</div>
                <div class="muted">Demandez du matériel pour vos ateliers.</div>
            </div>
            <div class="cta">
                <!-- Fallback to inventaire or logistics page if dashboard_formateur doesn't have partials -->
                <a href="{% url 'logistics:inventaire' %}" class="btn">Créer</a>
            </div>
        </div>
    {% else %}
        <div class="dash-card">
            <div>
                <div class="title">Mes cours</div>
                <div class="muted">Cours assignés à votre niveau scolaire.</div>
            </div>
            <div class="cta">
                <!-- Anchor to the courses section below to avoid HTMX nesting -->
                <a href="#mes-cours" class="btn">Voir</a>
            </div>
        </div>
    {% endif %}
</div>
