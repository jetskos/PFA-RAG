{% extends 'base.html' %}

{% block title %}Gérer le chapitre | {{ chapitre.titre }}{% endblock %}

{% block content %}
<style>
    /* La Modale en pur CSS */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
    .modal-content { background: var(--surface); padding: 2rem; border-radius: var(--radius-lg); width: 100%; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
</style>

<section class="page-shell">
    <div style="margin-bottom: 2rem;">
        <a href="{% url 'apprentissage:gerer_cours' pk=chapitre.cours.pk %}" class="btn-ghost" style="padding: 6px 12px; font-size: 0.9rem; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; border-radius: 6px; border: 1px solid var(--bordure); background: var(--surface);">
            <i class="ti ti-arrow-left"></i> Retour à la gestion du cours
        </a>
    </div>
    
    {% include 'apprentissage/partials/chapitre_detail.html' %}

    <div id="form-modal" class="modal-overlay">
        <div class="modal-content" id="modal-body">
        </div>
    </div>
</section>

<script>
    document.getElementById('form-modal').addEventListener('click', function(e) {
        if (e.target === this) this.style.display = 'none';
    });
</script>
{% endblock %}
