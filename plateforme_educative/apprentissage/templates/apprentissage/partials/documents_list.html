{% if documents %}
    <div style="display: flex; flex-direction: column; gap: 0.75rem;">
        {% for document in documents %}
            <div class="carte" style="padding: 1rem;">
                <div style="display:flex; justify-content:space-between; gap:1rem; align-items:flex-start;">
                    <div style="flex:1;">
                        <strong>{{ document.titre }}</strong>
                        <p style="margin: 0.35rem 0 0 0; color: var(--texte-secondaire);">{{ document.get_type_document_display }}</p>
                        {% if document.description %}
                            <p style="margin: 0.35rem 0 0 0;">{{ document.description }}</p>
                        {% endif %}
                    </div>

                    <div class="actions" style="margin-top:0; gap:0.4rem; flex-wrap:nowrap;">
                        <button type="button"
                                class="btn btn-ghost"
                                style="padding:0.45rem 0.7rem; font-size:0.85rem;"
                                onclick="fetch('{% url 'apprentissage:editer_document' document.id %}', {headers: {'X-Requested-With': 'XMLHttpRequest'}}).then(function(response){ return response.text(); }).then(function(html){ document.getElementById('form-container').innerHTML = html; });">
                            Modifier
                        </button>
                        <button type="button"
                                class="btn btn-ghost"
                                style="padding:0.45rem 0.7rem; font-size:0.85rem; color:#9b1c1c; border-color:#f5c2c7;"
                                onclick="if(confirm('Supprimer ce document ?')) { fetch('{% url 'apprentissage:supprimer_document' document.id %}', {method: 'POST', headers: {'X-CSRFToken': '{{ csrf_token }}', 'X-Requested-With': 'XMLHttpRequest'}}).then(function(response){ return response.text(); }).then(function(html){ document.getElementById('documents-container').innerHTML = html; document.getElementById('form-container').innerHTML = ''; }); }">
                            Supprimer
                        </button>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
{% else %}
    <p class="message-empty">Aucun document</p>
{% endif %}
