{% load i18n %}
<nav class="profile-nav" aria-label="{% translate 'Navigation du profil' %}">
    <a href="{% url 'accounts:profile' %}"
       class="profile-nav__tab {% if profile_tab == 'apercu' %}is-active{% endif %}">
        <i class="ti ti-user-circle" aria-hidden="true"></i> {% translate "Aperçu du profil" %}
    </a>
    <a href="{% url 'accounts:profile_edit' %}"
       class="profile-nav__tab {% if profile_tab == 'edition' %}is-active{% endif %}">
        <i class="ti ti-settings" aria-hidden="true"></i> {% translate "Paramètres" %}
    </a>
    <a href="{% url 'accounts:change_password' %}"
       class="profile-nav__tab {% if profile_tab == 'securite' %}is-active{% endif %}">
        <i class="ti ti-lock" aria-hidden="true"></i> {% translate "Sécurité" %}
    </a>
</nav>

<style>
    .profile-nav {
        position: relative;
        z-index: 5;
        display: inline-flex;
        width: fit-content;
        gap: 0.35rem;
        padding: 0.35rem;
        border-radius: var(--radius-md);
        background: var(--bg-surface);
        border: 1px solid var(--border-light);
        margin-bottom: 2rem;
        box-shadow: var(--shadow-sm);
    }
    .profile-nav__tab {
        position: relative;
        z-index: 1;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.6rem 1.2rem;
        border-radius: 8px;
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--text-muted);
        text-decoration: none;
        cursor: pointer;
        transition: var(--transition);
        white-space: nowrap;
    }
    .profile-nav__tab:hover {
        color: var(--primary);
        background: var(--primary-ultra-light);
    }
    [data-theme="dark"] .profile-nav__tab:hover {
        background: rgba(13, 148, 136, 0.12);
    }
    .profile-nav__tab.is-active {
        background: var(--primary);
        color: #ffffff !important;
        box-shadow: 0 4px 12px rgba(13, 148, 136, 0.25);
    }
    
    @media (max-width: 768px) {
        .profile-nav {
            display: flex;
            width: 100%;
            gap: 0.25rem;
            padding: 0.25rem;
            margin-bottom: 1.25rem;
        }
        .profile-nav__tab {
            flex: 1 1 0;
            min-width: 0;               /* autorise le rétrécissement */
            justify-content: center;
            gap: 0;
            font-size: 0.8rem;
            padding: 0.55rem 0.35rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        /* icônes retirées sur mobile : le libellé suffit et gagne ~24px/onglet */
        .profile-nav__tab i {
            display: none;
        }
    }
</style>
